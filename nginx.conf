resolver 1.1.1.1 8.8.8.8 valid=300s;

server {
    listen       9001;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Reverse proxy: browser calls /api/... on this same origin, nginx
    # forwards it server-to-server to the real API. No cross-origin
    # request ever happens in the browser, so CORS doesn't apply.
    location /api/ {
        proxy_pass https://gps-specials.polydial.com/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host gps-specials.polydial.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: fall back to index.html for any unknown path
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
